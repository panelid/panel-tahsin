<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — Panel Tahsin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { teal: { 50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',500:'#14b8a6',600:'#0d9488',700:'#0f766e' }, gold: { 500:'#d4a843',600:'#c8923d' } } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-teal-600 flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Buat Akun Panel Tahsin</h1>
      <p class="text-sm text-slate-500 mt-1">Sudah punya akun? <a href="login.html" class="text-teal-600 font-medium hover:underline">Masuk di sini</a></p>
    </div>

    <div class="bg-white rounded-2xl p-8 border border-slate-100 shadow-sm">
      <div id="error-msg" class="hidden bg-red-50 text-red-600 text-sm px-4 py-3 rounded-xl mb-4 border border-red-100"></div>
      <div id="success-msg" class="hidden bg-teal-50 text-teal-700 text-sm px-4 py-3 rounded-xl mb-4 border border-teal-100"></div>

      <form id="registerForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Nama Lengkap</label>
          <input type="text" id="name" required placeholder="Nama lengkap" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
          <input type="email" id="email" required placeholder="email@contoh.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <input type="password" id="password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 focus:outline-none focus:ring-2 focus:ring-teal-500 transition">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Daftar Sebagai</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="relative cursor-pointer">
              <input type="radio" name="role" value="murid" checked class="peer sr-only">
              <div class="border-2 border-slate-200 peer-checked:border-teal-600 peer-checked:bg-teal-50 rounded-xl p-4 text-center transition">
                <div class="text-2xl mb-1">📖</div>
                <div class="font-semibold text-slate-800 text-sm">Murid</div>
                <div class="text-xs text-slate-500">Setor bacaan</div>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="role" value="guru" class="peer sr-only">
              <div class="border-2 border-slate-200 peer-checked:border-gold-600 peer-checked:bg-yellow-50 rounded-xl p-4 text-center transition">
                <div class="text-2xl mb-1">🎓</div>
                <div class="font-semibold text-slate-800 text-sm">Guru</div>
                <div class="text-xs text-slate-500">Review setoran</div>
              </div>
            </label>
          </div>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3.5 rounded-xl transition shadow-md shadow-teal-600/20">
          Daftar Sekarang
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '';
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      const errorEl = document.getElementById('error-msg');
      const successEl = document.getElementById('success-msg');
      const btn = document.getElementById('submitBtn');

      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Mendaftarkan...';

      try {
        const res = await fetch(`${API_BASE}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, role })
        });
        const data = await res.json();
        if (!data.success) {
          errorEl.textContent = data.error || 'Gagal mendaftar';
          errorEl.classList.remove('hidden');
          btn.disabled = false; btn.textContent = 'Daftar Sekarang';
          return;
        }
        successEl.textContent = 'Berhasil! Mengarahkan ke halaman masuk...';
        successEl.classList.remove('hidden');
        setTimeout(() => window.location.href = 'login.html', 1500);
      } catch (err) {
        errorEl.textContent = 'Terjadi kesalahan. Coba lagi.';
        errorEl.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Daftar Sekarang';
      }
    });
  </script>

</body>
</html>
