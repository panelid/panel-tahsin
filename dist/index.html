<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponpes Digital — Platform Tahsin Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-50 min-h-screen text-gray-800">
  <div class="max-w-md mx-auto p-6">
    <h1 class="text-2xl font-bold text-teal-700 mb-2">📖 Ponpes Digital</h1>
    <p class="text-sm text-gray-600 mb-6">Setor & review tahsin online — Iqro, Al-Fatihah, Juz Amma, Tilawah, Hafalan.</p>

    <div id="app">
      <div class="bg-white rounded-xl shadow p-4 mb-4">
        <h2 class="font-semibold mb-2">Daftar</h2>
        <input id="name" placeholder="Nama" class="w-full border p-2 rounded mb-2">
        <input id="email" placeholder="Email" class="w-full border p-2 rounded mb-2">
        <input id="wa" placeholder="WhatsApp (62...)" class="w-full border p-2 rounded mb-2">
        <input id="pass" type="password" placeholder="Password" class="w-full border p-2 rounded mb-2">
        <select id="role" class="w-full border p-2 rounded mb-2">
          <option value="murid">Murid</option>
          <option value="guru">Guru (perlu verifikasi)</option>
        </select>
        <input id="ref" placeholder="Kode referral (opsional)" class="w-full border p-2 rounded mb-2">
        <button onclick="register()" class="w-full bg-teal-600 text-white p-2 rounded">Daftar</button>
        <p id="msg" class="text-sm mt-2"></p>
      </div>
      <p class="text-xs text-gray-500">Punya akun? Lihat profil: <a class="text-teal-600" href="/@sobur">/@sobur</a></p>
    </div>
  </div>

  <script>
    async function register() {
      const body = {
        name: name.value, email: email.value, wa_number: wa.value,
        password: pass.value, role: role.value, ref: ref.value || undefined
      };
      const r = await fetch('/api/auth/register', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
      });
      const d = await r.json();
      if (d.success) {
        msg.textContent = 'Berhasil! Kode referral: ' + d.user.referral_code + ' — profil: /@' + d.user.referral_code;
        msg.className = 'text-green-600 text-sm mt-2';
      } else {
        msg.textContent = d.error;
        msg.className = 'text-red-600 text-sm mt-2';
      }
    }
  </script>
</body>
</html>
