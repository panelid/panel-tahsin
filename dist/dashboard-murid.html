<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponpes Digital — Dashboard Murid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-50 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-teal-700 mb-4">📖 Dashboard Murid</h1>
    <div id="app" class="space-y-4"></div>
  </div>
  <script>
    const uid = new URLSearchParams(location.search).get('uid') || localStorage.getItem('uid');
    if (uid) localStorage.setItem('uid', uid);
    async function load() {
      if (!uid) { document.getElementById('app').innerHTML = '<p>Login dulu (daftar → simpan uid).</p>'; return; }
      const r = await fetch('/api/murid/' + uid); const d = await r.json();
      let html = '<p class="text-lg">Halo <b>' + d.user.name + '</b></p>';
      html += '<h2 class="font-semibold mt-4">Track Aktif</h2>';
      d.enrollments.forEach(e => html += '<div class="bg-white p-3 rounded shadow">'+e.track+' — '+e.status+(e.current_unit?' (unit: '+e.current_unit+')':'')+'</div>');
      html += '<h2 class="font-semibold mt-4">Setoran Terakhir</h2>';
      d.setoran.forEach(s => html += '<div class="bg-white p-3 rounded shadow">'+s.track_id+' — '+s.status+' ('+s.created_at+')</div>');
      html += '<div class="mt-6 p-4 bg-white rounded"><h3 class="font-semibold mb-2">Mulai Track Baru</h3>'+
        '<select id="track" class="border p-2 rounded"><option value="iqro">Iqro</option><option value="fatihah">Al-Fatihah</option><option value="juz_amma">Juz Amma</option><option value="tilawah">Tilawah</option><option value="hafalan">Hafalan</option></select>'+
        '<input id="unit" placeholder="Unit mulai (misal: Iqro 3 hal 10)" class="border p-2 rounded w-full my-2">'+
        '<button onclick="enroll()" class="bg-teal-600 text-white p-2 rounded">Mulai</button></div>';
      document.getElementById('app').innerHTML = html;
    }
    async function enroll() {
      await fetch('/api/enroll', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,trackId:track.value,currentUnit:unit.value})});
      load();
    }
    load();
  </script>
</body>
</html>
