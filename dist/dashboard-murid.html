<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Santri — ponpes.org</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet">
  <style>
    :root{--base:#F6F5EF;--teal:#1E4640;--amber:#E3A23B;--ink:#1C2420;--soft:#E7EEE6;--muted:#5A655F;--line:#D9DED8}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--base);color:var(--ink);font-size:16px;line-height:1.7;padding:24px 16px}
    .wrap{max-width:640px;margin:0 auto}
    h1{font-family:'Literata',serif;font-size:28px;margin-bottom:4px}
    h2{font-size:18px;color:var(--teal);margin:24px 0 10px}
    .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
    .track-pill{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:14px}
    .ipt{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-family:'Plus Jakarta Sans';font-size:14px;background:#fff;color:var(--ink);margin-top:6px}
    .ipt:focus{outline:2px solid var(--amber)}
    .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;border-radius:12px;padding:11px 20px;text-decoration:none;cursor:pointer;border:1px solid transparent;font-family:'Plus Jakarta Sans'}
    .btn-teal{background:var(--teal);color:#fff}
    .btn-teal:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,70,64,.3)}
    a{color:var(--teal);font-weight:600;text-decoration:none}
    .back{display:inline-block;margin-bottom:12px;font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back">← ponpes.org</a>
    <h1>Dashboard Santri</h1>
  <script>
    const uid = new URLSearchParams(location.search).get('uid') || localStorage.getItem('uid');
    if (uid) localStorage.setItem('uid', uid);
    async function load() {
      if (!uid) { document.getElementById('app').innerHTML = '<p>Login dulu (daftar → simpan uid).</p>'; return; }
      const r = await fetch('/api/enroll/' + uid); const d = await r.json();
      if (d.error) { document.getElementById('app').innerHTML = '<p>'+d.error+'</p>'; return; }
      let html = '<p class="text-lg">Halo <b>' + d.user.name + '</b></p>';
      html += '<h2 class="font-semibold mt-4">Track Aktif</h2>';
      (d.enrollments||[]).forEach(e => html += '<div class="track-pill">'+e.track+' — '+e.status+(e.current_unit?' (unit: '+e.current_unit+')':'')+'</div>');
      html += '<h2 class="font-semibold mt-4">Setoran Terakhir</h2>';
      (d.setoran||[]).forEach(s => html += '<div class="track-pill">'+s.track_id+' — '+s.status+' ('+s.created_at+')</div>');
      html += '<div class="mt-6 p-4 box"><h3 class="font-semibold mb-2">Mulai Track Baru</h3>'+
        '<select id="track" class="ipt"><option value="iqro">Iqro</option><option value="fatihah">Al-Fatihah</option><option value="juz_amma">Juz Amma</option><option value="tilawah">Tilawah</option><option value="hafalan">Hafalan</option></select>'+
        '<input id="unit" placeholder="Unit mulai (misal: Iqro 3 hal 10)" class="ipt w-full my-2">'+
        '<button onclick="enroll()" class="btn btn-teal">Mulai</button></div>';
      document.getElementById('app').innerHTML = html;
    }
    async function enroll() {
      await fetch('/api/enroll', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userId:uid,trackId:track.value,currentUnit:unit.value})});
      load();
    }
    load();
  </script>
</body>
</html>
