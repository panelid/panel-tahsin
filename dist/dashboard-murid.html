<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Santri — ponpes.org</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet">
  <style>
    :root{--base:#F6F5EF;--teal:#1E4640;--amber:#E3A23B;--ink:#1C2420;--soft:#E7EEE6;--muted:#5A655F;--line:#D9DED8}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--base);color:var(--ink);font-size:16px;line-height:1.6;padding:20px 14px}
    .wrap{max-width:640px;margin:0 auto}
    h1{font-family:'Literata',serif;font-size:26px;margin-bottom:4px}
    h2{font-size:17px;color:var(--teal);margin:22px 0 8px}
    .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
    .pill{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-bottom:7px;font-size:14px}
    .ipt{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:12px;font-family:'Plus Jakarta Sans';font-size:14px;background:#fff;color:var(--ink);margin-top:6px}
    .ipt:focus{outline:2px solid var(--amber)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;border-radius:12px;padding:11px 18px;text-decoration:none;cursor:pointer;border:1px solid transparent;font-family:'Plus Jakarta Sans'}
    .btn-teal{background:var(--teal);color:#fff}
    .btn-teal:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 14px rgba(30,70,64,.25)}
    .btn-amber{background:var(--amber);color:#221A06}
    .btn-red{background:#c0392b;color:#fff}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    a{color:var(--teal);font-weight:600;text-decoration:none}
    .back{display:inline-block;margin-bottom:10px;font-size:14px}
    .rec-dot{width:10px;height:10px;border-radius:50%;background:#c0392b;display:inline-block;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    audio{width:100%;margin-top:6px}
    .wave{display:flex;align-items:flex-end;gap:3px;height:20px;margin:8px 0}
    .wave span{width:4px;background:var(--teal);border-radius:2px;opacity:.3;height:100%}
    .wave span:nth-child(odd){opacity:.55}
    .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
    .b-pending{background:#FCEFD6;color:#9a6b15}
    .b-reviewed{background:#DFF3E6;color:#1E8E4E}
    .muted{color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back">← ponpes.org</a>
    <h1>Dashboard Santri</h1>
    <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div id="app"><p class="muted">Memuat…</p></div>
  </div>
  <script>
    const app = document.getElementById('app');
    const uid = new URLSearchParams(location.search).get('uid') || localStorage.getItem('uid');
    if (uid) localStorage.setItem('uid', uid);
    if (!uid) location.href = '/login.html';

    async function load() {
      if (!uid) return;
      try {
        const r = await fetch('/api/enroll/' + uid);
        const d = await r.json();
        if (d.error) { app.innerHTML = '<p>' + d.error + '</p>'; return; }
        let h = '<p>Halo <b>' + d.user.name + '</b> · @' + (d.user.username||'') + '</p>';

        // --- Rekam setoran ---
        const trackOpts = (d.enrollments||[]).map(e => '<option value="'+e.track_id+'">'+e.track+' '+(e.current_unit?'(unit: '+e.current_unit+')':'')+'</option>').join('')
          || '<option value="iqro">Iqro</option><option value="fatihah">Al-Fatihah</option><option value="juz_amma">Juz Amma</option><option value="tilawah">Tilawah</option><option value="hafalan">Hafalan</option>';
        h += '<div class="box"><h2 style="margin-top:0">Rekam Setoran</h2>'
          + '<label class="muted">Pilih track</label><select id="recTrack" class="ipt">'+trackOpts+'</select>'
          + '<label class="muted">Unit / halaman (cth: Iqro 3 hal 10)</label><input id="recUnit" class="ipt" placeholder="Iqro 3 hal 10">'
          + '<div id="recStatus" class="muted" style="margin-top:8px">Tekan mulai untuk rekam bacaan.</div>'
          + '<div style="display:flex;gap:8px;margin-top:10px">'
          + '<button id="recBtn" class="btn btn-red" onclick="toggleRec()">● Rekam</button>'
          + '<button id="submitBtn" class="btn btn-teal" disabled onclick="submitSetoran()">Kirim Setoran</button></div>'
          + '<div id="preview"></div></div>';

        // --- Setoran terakhir ---
        h += '<h2>Setoran Saya</h2>';
        if (!(d.setoran||[]).length) h += '<div class="pill muted">Belum ada setoran.</div>';
        (d.setoran||[]).forEach(s => {
          const badge = s.status === 'reviewed' ? '<span class="badge b-reviewed">revi...' : '<span class="badge b-pending">menunggu</span>';
          const audio = s.audio_url ? '<audio controls src="'+s.audio_url+'"></audio>' : '<p class="muted">audio tidak tersedia</p>';
          h += '<div class="box" style="margin-top:8px"><div style="display:flex;justify-content:space-between"><b>'+(s.track_id||'-')+'</b>'+badge+'</div><div class="muted">'+(s.unit_ref||'')+' · '+(s.created_at||'')+'</div>'+audio+'</div>';
        });
        app.innerHTML = h;
      } catch (e) { app.innerHTML = '<p style="color:#c0392b">Gagal memuat: ' + e.message + '</p>'; }
    }

    // --- Recorder ---
    let mediaRecorder, chunks = [], recording = false, audioBlob = null;
    async function toggleRec() {
      if (!recording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
          mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
          chunks = [];
          mediaRecorder.ondataavailable = e => chunks.push(e.data);
          mediaRecorder.onstop = () => {
            audioBlob = new Blob(chunks, { type: mime });
            const url = URL.createObjectURL(audioBlob);
            document.getElementById('preview').innerHTML = '<p class="muted">Pratinjau:</p><audio controls src="'+url+'"></audio>';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('recStatus').textContent = 'Rekaman siap dikirim (' + (audioBlob.size/1024).toFixed(0) + ' KB).';
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start();
          recording = true;
          document.getElementById('recBtn').textContent = '■ Stop';
          document.getElementById('recStatus').innerHTML = '<span class="rec-dot"></span> Merekam…';
        } catch (e) { document.getElementById('recStatus').textContent = 'Gagal akses mic: ' + e.message; }
      } else {
        mediaRecorder.stop();
        recording = false;
        document.getElementById('recBtn').textContent = '● Rekam';
      }
    }

    async function submitSetoran() {
      if (!audioBlob) return;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Mengirim…';
      const fd = new FormData();
      fd.append('audio', audioBlob, 'setoran.webm');
      fd.append('user_id', uid);
      fd.append('track_id', document.getElementById('recTrack').value);
      fd.append('unit_ref', document.getElementById('recUnit').value);
      try {
        const res = await fetch('/api/setoran/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (!data.success) throw new Error(data.error);
        audioBlob = null;
        load();
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Kirim Setoran';
        document.getElementById('recStatus').textContent = 'Gagal: ' + e.message;
      }
    }

    load();
  </script>
</body>
</html>
