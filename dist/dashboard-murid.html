<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Santri — ponpes.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,500;7..72,600&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/rec.js" defer></script>
<body data-page="murid" data-tab="home">
<div id="hdr"></div>
<div class="wrap">
  <div class="hero">
    <div class="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّرَّحِيمِ</div>
    <h1 id="heroName">Assalamu’alaikum</h1>
    <p id="heroSub">Baca, rekam, dan ustadz akan mereview-nya. Santai, tapi istiqomah.</p>
    <div id="heroWave"></div>
  </div>

  <div id="ustripWrap" style="display:none">
    <div class="ustrip" id="ustrip"></div>
  </div>

  <div id="app"><p class="muted" style="text-align:center;padding:30px">Memuat…</p></div>
</div>
<nav id="nav"></nav>
<script src="/assets/app.js"></script>
<script>
const app = document.getElementById('app');
const uid = new URLSearchParams(location.search).get('uid') || localStorage.getItem('uid');
if (uid) localStorage.setItem('uid', uid);
if (!uid) location.href = '/login';
document.getElementById('heroWave').outerHTML = PP.wave(30);
const TRACKS = [['iqro','Iqro','📗'],['fatihah','Al-Fatihah','🕌'],['juz_amma','Juz Amma','🌙'],['tilawah','Tilawah','🎧'],['hafalan','Hafalan','📿']];

async function load() {
  try {
    const d = await (await fetch('/api/enroll/' + uid)).json();
    if (d.error) { app.innerHTML = '<div class="empty"><span class="big">🙏</span>' + PP.esc(d.error) + '</div>'; return; }
    const nm = d.user.name.split(' ')[0];
    document.getElementById('heroName').textContent = 'Assalamu’alaikum, ' + nm;
    const enr = d.enrollments || [], set = d.setoran || [];
    const active = enr.filter(e => e.status === 'active');
    const rev = set.filter(s => s.status === 'reviewed').length;
    const waiting = set.filter(s => s.status !== 'reviewed').length;

    let h = '';
    h += '<div class="stats">'
      + '<div class="stat"><b>' + active.length + '</b><span>Track</span></div>'
      + '<div class="stat"><b>' + set.length + '</b><span>Setoran</span></div>'
      + '<div class="stat"><b>' + rev + '</b><span>Direview</span></div></div>';

    // ---- BACAAN SELANJUTNYA (curriculum + audio acuan) ----
    const goal = d.user.goal || 'read', lvl = d.user.level || 'beginner';
    h += '<div class="card" id="nextCard" style="border-color:var(--mint2);background:linear-gradient(160deg,#fff,var(--mint))"><div class="card-t">📖 Bacaan Selanjutnya</div><div class="card-s" id="nextSub">Menyiapkan panduan untukmu…</div></div>';

    // ---- LIVE CARD (prominent) ----
    h += '<div class="live-card" id="liveCard">'
      + '<div class="lt">🎙 Ngaji Live Koreksi 1-on-1</div>'
      + '<div class="ls" id="liveSub">Pilih ustadz yang sedang online, lalu minta sesi. Nanti kamu bisa baca & langsung dikoreksi.</div>'
      + '<div id="liveBtnWrap"></div></div>';

    // ---- SIMPLE RECORDER ----
    const opts = (active.length ? active.map(e => [e.track_id || TRACKS.find(t => t[1] === e.track)[0], e.track, e.current_unit]) : TRACKS)
      .map(t => '<option value="' + PP.esc(t[0]) + '">' + PP.esc(t[1]) + (t[2] ? ' · ' + PP.esc(t[2]) : '') + '</option>').join('');
    h += '<div class="card" id="rekam">'
      + '<div class="card-t">🎙 Rekam Setoran</div><div class="card-s">Tap tombol, baca dengan tartil, lalu kirim. Ustadz mereview-nya nanti.</div>'
      + '<div class="field"><label>Pelajaran</label><select id="recTrack" class="input">' + opts + '</select></div>'
      + '<div class="field"><label>Unit / halaman (opsional)</label><input id="recUnit" class="input" placeholder="cth: Iqro 3 hal 10"></div>'
      + '<div class="rec"><div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'
      + '<button class="rec-orb" id="recBtn" onclick="toggleRec()">REKAM</button><div class="rec-time" id="recTime">00:00</div></div>'
      + '<p class="hint" id="recStatus" style="text-align:center">Tekan tombol untuk mulai</p>'
      + '<div id="preview"></div>'
      + '<button class="btn btn-primary btn-block" id="submitBtn" style="margin-top:12px" disabled onclick="submitSetoran()">Kirim Setoran</button>'
      + '</div>';

    // ---- SETORAN ----
    h += '<div class="card"><div class="card-t">📚 Setoranku</div>';
    if (!set.length) h += '<div class="empty"><span class="big">🎙</span>Belum ada setoran. Mulai rekam bacaanmu!</div>';
    set.slice(0, 6).forEach((s, i) => {
      const b = s.status === 'reviewed' ? '<span class="badge b-ok">✓ direview</span>' : '<span class="badge b-pend">⏳ menunggu</span>';
      const au = s.audio_url ? '<audio controls preload="none" src="' + s.audio_url + '"></audio>' : '';
      h += '<div class="item" style="animation-delay:' + (i * 45) + 'ms"><div class="item-h"><b>' + PP.esc(s.track_id || '-') + '</b>' + b + '</div>'
        + '<div class="sub">' + PP.esc(s.unit_ref || '') + (s.created_at ? ' · ' + PP.fmt(s.created_at) : '') + '</div>' + au + '</div>';
    });
    h += '</div>';

    // ---- LEARNING PATH ----
    h += '<div class="card"><div class="card-t">🗂 Perjalanan Belajar</div>';
    const path = enr.length ? enr : [{track:'Iqro',status:'active'},{track:'Al-Fatihah',status:'pending'},{track:'Juz Amma',status:'pending'}];
    h += '<div class="path">' + path.map((e, i) => {
      const cls = e.status === 'done' ? 'done' : (e.status === 'active' ? 'cur' : '');
      return '<div class="step ' + cls + '"><div class="dot">' + (e.status === 'done' ? '✓' : i + 1) + '</div><div class="lab">' + PP.esc(e.track) + '</div>' + (i < path.length - 1 ? '<div class="bar"></div>' : '') + '</div>';
    }).join('') + '</div></div>';

    h += '<div class="foot">ponpes.org — platform tahsin & ngaji online gratis</div>';
    app.innerHTML = h;
    loadGurus();
    checkLive();
    loadNext(goal, lvl);
  } catch (e) { app.innerHTML = '<div class="empty">Gagal memuat: ' + PP.esc(e.message) + '</div>'; }
}
async function loadNext(goal, lvl) {
  const c = await (await fetch('/api/curriculum?goal=' + encodeURIComponent(goal) + '&level=' + encodeURIComponent(lvl))).json().catch(() => null);
  const card = document.getElementById('nextCard'); if (!card) return;
  if (!c) { card.remove(); return; }
  const first = (c.plan || [])[0]; if (!first) { card.remove(); return; }
  let html = '<div class="track" style="border:none;padding-bottom:6px"><div class="ico">📖</div><div style="flex:1"><div class="nm">' + PP.esc(first.name) + '</div><div class="sub">' + PP.esc(first.note || '') + '</div></div></div>';
  if (c.refAudio && c.refAudio.url) {
    html += '<div class="sub" style="margin:2px 0 4px">🎧 <b>Audio acuan</b> — dengar dulu, lalu rekam di bawah:</div><audio controls preload="none" src="' + c.refAudio.url + '"></audio>';
  } else {
    html += '<div class="sub">Rekam bacaan di atas, ustadz akan mereview-nya.</div>';
  }
  html += '<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--ever);font-weight:600;font-size:13px">Lihat rencana lengkap</summary><div style="margin-top:8px">'
    + (c.plan || []).map(p => '<div class="sub">• ' + PP.esc(p.name) + (p.note ? ' — ' + PP.esc(p.note) : '') + '</div>').join('') + '</div></details>';
  document.getElementById('nextSub').outerHTML = html.replace(/^<div class="track"[^>]*>/, '<div>').replace(/<\/div>$/, '');
}

// ── live ngaji (murid) ──
let liveSid = null, liveTimer = null, liveAfter = '1970-01-01', liveBlob = null, liveMr = null, liveChunks = [], liveRec = false, liveT0, liveTick;
async function loadGurus() {
  const online = await (await fetch('/api/presence?list=1')).json();
  const list = online.online || [];
  const wrap = document.getElementById('ustripWrap');
  const strip = document.getElementById('ustrip');
  if (!list.length) {
    wrap.style.display = '';
    strip.innerHTML = '<span class="t">Ustadz</span><div class="empty" style="padding:6px 0"><span class="sub">Belum ada ustadz online. Rekam setoran — ustadz akan mereview-nya nanti, atau kirim undangan ke ustadzmu.</span></div>';
    return;
  }
  wrap.style.display = '';
  strip.innerHTML = '<span class="t">Ustadz Online</span>' + list.map(g =>
    '<div class="us" onclick="quickLive(\'' + g.id + '\')"><div class="ring">' + PP.esc((g.name || '?').charAt(0).toUpperCase()) + '<span class="dot on"></span></div><div class="nm">' + PP.esc((g.name || '').split(' ')[0]) + '</div></div>'
  ).join('');
}
async function checkLive() {
  const s = await (await fetch('/api/live?muridId=' + uid)).json();
  const sub = document.getElementById('liveSub'), btnw = document.getElementById('liveBtnWrap');
  if (!s) {
    btnw.innerHTML = '<button class="btn btn-gold btn-block" onclick="openLivePicker()">Mulai Ngaji Live</button>';
    sub.innerHTML = 'Pilih ustadz yang sedang online di atas, atau tekan tombol untuk pilih dari daftar.';
    liveSid = null;
  } else if (s.status === 'pending') {
    btnw.innerHTML = '<button class="btn btn-ghost btn-block" disabled>⏳ Menunggu ustadz…</button>';
    sub.innerHTML = 'Permintaan terkirim. Ustadz akan dapat notif — sesi otomatis buka bila diterima.';
  } else if (s.status === 'rejected') {
    btnw.innerHTML = '<button class="btn btn-gold btn-block" onclick="openLivePicker()">Minta Lagi</button>';
    sub.innerHTML = 'Ustadz belum bisa sekarang. Coba lagi nanti ya.';
    liveSid = null;
  } else if (s.status === 'active') {
    sub.innerHTML = '<span class="live-pulse"></span>Sesi live aktif! Baca, lalu kirim untuk dikoreksi.';
    btnw.innerHTML = '<button class="btn btn-primary btn-block" onclick="openLiveBox()">Masuk Sesi Live</button>';
    liveSid = s.id;
  }
  if (liveSid) pollLive();
}
function openLivePicker() {
  const online = (async () => { const o = await (await fetch('/api/presence?list=1')).json(); return o.online || []; })();
  online.then(list => {
    const all = (async () => { const g = await (await fetch('/api/guru/list')).json(); return g.gurus || []; })();
    all.then(g => {
      const sel = '<select id="guruPick" class="input" style="margin:10px 0">' + g.map(x => '<option value="' + x.id + '">' + PP.esc(x.name) + (x.username ? ' (@' + x.username + ')' : '') + '</option>').join('') + '</select>';
      app.insertAdjacentHTML('afterbegin', '<div class="card" id="pickCard"><div class="card-t">Pilih Ustadz</div>' + sel + '<button class="btn btn-gold btn-block" onclick="startLive()">Minta Sesi Live</button><button class="btn btn-ghost btn-block" onclick="document.getElementById(\'pickCard\').remove()">Batal</button></div>');
    });
  });
}
async function quickLive(gid) {
  const d = await (await fetch('/api/live', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start', muridId: uid, guruId: gid }) })).json();
  if (!d.success) return alert(d.error);
  checkLive();
}
async function startLive() {
  const gid = document.getElementById('guruPick').value; if (!gid) return alert('Pilih ustadz.');
  const d = await (await fetch('/api/live', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start', muridId: uid, guruId: gid }) })).json();
  if (!d.success) return alert(d.error);
  const pc = document.getElementById('pickCard'); if (pc) pc.remove();
  checkLive();
}
async function openLiveBox() { /* replace app with live view */
  app.innerHTML = '<div class="card"><div class="card-t">🎙 Sesi Live Aktif</div><div class="card-s">Baca lalu tekan kirim. Ustadz akan membalas koreksinya.</div>'
    + '<div id="liveMsgs" style="max-height:280px;overflow:auto;margin-bottom:12px"></div>'
    + '<div class="rec"><div class="eq" id="leq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><button class="rec-orb" id="lrec" onclick="liveToggle()">REKAM</button></div>'
    + '<button class="btn btn-primary btn-block" id="lsend" style="margin-top:10px" disabled onclick="liveSend()">Kirim Bacaan</button>'
    + '<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="liveEnd()">Akhiri Sesi</button></div>';
  liveAfter = '1970-01-01'; pollLive();
}
async function pollLive() {
  if (!liveSid) return;
  const d = await (await fetch('/api/live?sessionId=' + liveSid + '&after=' + encodeURIComponent(liveAfter))).json();
  if (d.session && d.session.status !== 'active') { alert('Sesi diakhiri.'); location.reload(); return; }
  const box = document.getElementById('liveMsgs');
  (d.messages || []).forEach(m => {
    const w = document.createElement('div'); w.className = 'item'; w.style.animation = 'none';
    w.innerHTML = '<div class="sub">' + (m.sender === 'guru' ? '🎓 Ustadz' : '🧕 Kamu') + '</div>' + (m.audio_url ? '<audio controls preload="none" src="' + m.audio_url + '"></audio>' : '') + (m.text ? '<div>' + PP.esc(m.text) + '</div>' : '');
    box.appendChild(w); box.scrollTop = box.scrollHeight; liveAfter = m.created_at;
  });
  liveTimer = setTimeout(pollLive, 2500);
}
async function liveToggle() {
  if (!liveRec) {
    try {
      const r = await HiRec.start({ onTick: t => lrec.textContent = fmt(t), onLevel: l => setEq(leq, l) });
      liveRec = true; lrec.textContent = 'SELESAI'; lrec.classList.add('on'); leq.classList.add('on');
    } catch (e) { alert('Gagal mic: ' + e.message); }
  } else {
    lrec.textContent = 'Memproses…'; lrec.disabled = true;
    const r = await HiRec.stop(); liveBlob = r.blob; liveRec = false; setEq(leq, 0);
    lsend.disabled = false; lrec.textContent = 'REKAM'; lrec.classList.remove('on'); leq.classList.remove('on'); lrec.disabled = false;
  }
}
async function liveSend() {
  if (!liveBlob) return; lsend.disabled = true; lsend.textContent = 'Mengirim…';
  const fd = new FormData(); fd.append('audio', liveBlob, 'live.webm'); fd.append('user_id', uid); fd.append('track_id', 'live'); fd.append('unit_ref', 'live-ngaji');
  const d = await (await fetch('/api/setoran/upload', { method: 'POST', body: fd })).json();
  await fetch('/api/live', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'message', sessionId: liveSid, sender: 'murid', userId: uid, audio_url: d.audio_url }) });
  liveBlob = null; lsend.textContent = 'Kirim Bacaan'; pollLive();
}
async function liveEnd() { await fetch('/api/live', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'end', sessionId: liveSid }) }); location.reload(); }

// ── recorder (HiRec) ──
let recording = false, blob = null;
function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function setEq(el, lvl) { if (!el) return; const bars = el.children; for (let i = 0; i < bars.length; i++) { const h = 9 + (lvl * 28 * (0.5 + Math.abs(Math.sin(i * 1.3)))); bars[i].style.height = Math.min(30, h) + 'px'; } }
async function toggleRec() {
  if (!recording) {
    try {
      recBtn.disabled = true;
      const r = await HiRec.start({ onTick: t => recTime.textContent = fmt(t), onLevel: l => setEq(eq, l) });
      recording = true; recBtn.disabled = false;
      recBtn.textContent = 'SELESAI'; recBtn.classList.add('on'); eq.classList.add('on'); recStatus.textContent = 'Merekam… baca dengan tartil.';
    } catch (e) { recStatus.textContent = 'Gagal akses mic: ' + e.message; recBtn.disabled = false; }
  } else {
    recBtn.disabled = true; recBtn.textContent = 'Memproses…';
    const r = await HiRec.stop();
    blob = r.blob; recording = false;
    setEq(eq, 0);
    document.getElementById('preview').innerHTML = '<div class="item" style="margin-top:12px"><div class="sub">Pratinjau rekaman (' + Math.round(r.size / 1024) + ' KB)</div><audio controls src="' + r.url + '"></audio></div>';
    submitBtn.disabled = false; recStatus.textContent = 'Rekaman siap — klik Kirim Setoran.';
    recBtn.textContent = 'REKAM'; recBtn.classList.remove('on'); eq.classList.remove('on'); recBtn.disabled = false;
  }
}
async function submitSetoran() {
  if (!blob) return;
  submitBtn.disabled = true; submitBtn.textContent = 'Mengirim…';
  const fd = new FormData(); fd.append('audio', blob, 'setoran.webm'); fd.append('user_id', uid);
  fd.append('track_id', recTrack.value); fd.append('unit_ref', recUnit.value);
  try {
    const d = await (await fetch('/api/setoran/upload', { method: 'POST', body: fd })).json();
    if (!d.success) throw new Error(d.error);
    blob = null; recTime.textContent = '00:00'; load();
  } catch (e) { submitBtn.disabled = false; submitBtn.textContent = 'Kirim Setoran'; recStatus.textContent = 'Gagal: ' + e.message; }
}
load();
// presence: kasih tahu server kita online (biar ustadz lihat murid? opsional) + refresh ustrip tiap 20s
setInterval(loadGurus, 20000);
</script>
</body>
</html>
