<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Santri — ponpes.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="murid" data-tab="home">
<div id="hdr"></div>
<div class="wrap">
  <div class="hero">
    <div class="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <h1 id="heroName">Dashboard Santri</h1>
    <p>Rencanakan setoranmu. Rekam bacaan, kirim, lalu tunggu review dari pengajar.</p>
    <div id="heroWave"></div>
  </div>
  <div id="app"><p class="muted" style="text-align:center;padding:30px">Memuat…</p></div>
</div>
<nav id="nav"></nav>
<script src="/assets/app.js"></script>
<script>
const app = document.getElementById('app');
const uid = new URLSearchParams(location.search).get('uid') || localStorage.getItem('uid');
if (uid) localStorage.setItem('uid', uid);
if (!uid) location.href = '/login';
document.getElementById('heroWave').outerHTML = PP.wave(30);

let TRACKS = [['iqro','Iqro','📗'],['fatihah','Al-Fatihah','🕌'],['juz_amma','Juz Amma','🌙'],['tilawah','Tilawah','🎧'],['hafalan','Hafalan','📿']];

async function load() {
  try {
    const d = await (await fetch('/api/enroll/' + uid)).json();
    if (d.error) { app.innerHTML = '<div class="empty"><span class="big">🙏</span>' + PP.esc(d.error) + '</div>'; return; }
    document.getElementById('heroName').textContent = 'Assalamu’alaikum, ' + d.user.name.split(' ')[0];

    const enr = d.enrollments || [];
    const active = enr.filter(e => e.status === 'active');
    const done = enr.filter(e => e.status === 'done').length;
    const set = d.setoran || [];
    const rev = set.filter(s => s.status === 'reviewed').length;

    // ---- LIVE NGAI 1-on-1 ----
    h += '<div class="card" id="liveCard">'
      + '<div class="card-t">🎙 Ngaji Live Koreksi 1-on-1</div>'
      + '<div class="card-s">Minta sesi ngaji live ke pengajar. Bila dia online & merespons, kamu bisa langsung baca & dikoreksi.</div>'
      + '<div id="liveStatus"></div>'
      + '<div class="field" style="margin-top:12px"><label>Pilih pengajar</label><select id="guruSel" class="input"></select></div>'
      + '<button class="btn btn-gold btn-block" id="liveBtn" onclick="startLive()">Minta Sesi Live</button>'
      + '<div id="liveBox" style="display:none;margin-top:14px"></div>'
      + '</div>';

    let h = '';
    h += '<div class="stats">'
       + '<div class="stat"><b>' + active.length + '</b><span>Track aktif</span></div>'
       + '<div class="stat"><b>' + set.length + '</b><span>Total setoran</span></div>'
       + '<div class="stat"><b>' + rev + '</b><span>Reviu diterima</span></div></div>';

    // ---- REKAM ----
    const opts = (active.length ? active.map(e => [e.track_id || TRACKS.find(t => t[1] === e.track)[0], e.track, e.current_unit]) : TRACKS)
      .map(t => '<option value="' + PP.esc(t[0]) + '">' + PP.esc(t[1]) + (t[2] ? ' · ' + PP.esc(t[2]) : '') + '</option>').join('');
    h += '<div class="card" id="rekam">'
      + '<div class="card-t">🎙 Rekam Setoran</div><div class="card-s">Pilih pelajaran, tekan tombol, baca dengan tartil.</div>'
      + '<div class="field"><label>Pelajaran</label><select id="recTrack" class="input">' + opts + '</select></div>'
      + '<div class="field"><label>Unit / halaman</label><input id="recUnit" class="input" placeholder="cth: Iqro 3 halaman 10"></div>'
      + '<div class="rec"><div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'
      + '<button class="rec-orb" id="recBtn" onclick="toggleRec()">REKAM</button>'
      + '<div class="rec-time" id="recTime">00:00</div></div>'
      + '<p class="hint" id="recStatus" style="text-align:center">Tekan tombol untuk mulai merekam.</p>'
      + '<div id="preview"></div>'
      + '<button class="btn btn-primary btn-block" id="submitBtn" style="margin-top:14px" disabled onclick="submitSetoran()">Kirim Setoran</button>'
      + '</div>';

    // ---- SETORAN ----
    h += '<div class="card"><div class="card-t">📚 Setoranku</div>';
    if (!set.length) h += '<div class="empty"><span class="big">🎙</span>Belum ada setoran. Mulai rekam bacaanmu!</div>';
    set.slice(0, 8).forEach((s, i) => {
      const b = s.status === 'reviewed' ? '<span class="badge b-ok">Direview</span>' : '<span class="badge b-pend">Menunggu</span>';
      const au = s.audio_url ? '<audio controls preload="none" src="' + s.audio_url + '"></audio>' : '';
      h += '<div class="item" style="animation-delay:' + (i * 45) + 'ms"><div class="item-h"><b>' + PP.esc(s.track_id || '-') + '</b>' + b + '</div>'
        + '<div class="sub">' + PP.esc(s.unit_ref || '') + (s.created_at ? ' · ' + PP.fmt(s.created_at) : '') + '</div>' + au + '</div>';
    });
    h += '</div>';

    // ---- TRACK ----
    h += '<div class="card"><div class="card-t">🗂 Perjalanan Belajar</div>';
    if (!enr.length) h += '<div class="empty"><span class="big">🌱</span>Belum mulai track apa pun.</div>';
    enr.forEach(e => {
      const pct = e.status === 'done' ? 100 : 30;
      h += '<div class="track"><div class="ico">' + (TRACKS.find(t => t[1] === e.track)?.[2] || '📖') + '</div>'
        + '<div style="flex:1"><div class="nm">' + PP.esc(e.track) + '</div><div class="sub">' + (e.current_unit ? 'Unit: ' + PP.esc(e.current_unit) : 'Aktif') + '</div>'
        + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>'
        + '<span class="badge ' + (e.status === 'done' ? 'b-ok' : 'b-pend') + '">' + (e.status === 'done' ? 'Selesai' : 'Aktif') + '</span></div>';
    });
    h += '</div><div class="foot">ponpes.org — platform tahsin & ngaji online gratis</div>';
    app.innerHTML = h;
  } catch (e) { app.innerHTML = '<div class="empty">Gagal memuat: ' + PP.esc(e.message) + '</div>'; }
}

let mr, chunks = [], recording = false, blob = null, t0, timer;
function tick() { const s = Math.floor((Date.now() - t0) / 1000); document.getElementById('recTime').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
async function toggleRec() {
  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      mr = new MediaRecorder(stream, { mimeType: mime }); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        blob = new Blob(chunks, { type: mime });
        document.getElementById('preview').innerHTML = '<div class="item" style="margin-top:12px"><div class="sub">Pratinjau hasil rekaman</div><audio controls src="' + URL.createObjectURL(blob) + '"></audio></div>';
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('recStatus').textContent = 'Rekaman siap (' + Math.round(blob.size / 1024) + ' KB) — kirim atau rekam ulang.';
        stream.getTracks().forEach(t => t.stop());
      };
      mr.start(); recording = true; t0 = Date.now(); timer = setInterval(tick, 250);
      document.getElementById('recBtn').textContent = 'SELESAI'; document.getElementById('recBtn').classList.add('on');
      document.getElementById('eq').classList.add('on'); document.getElementById('recStatus').textContent = 'Merekam… baca dengan tartil.';
    } catch (e) { document.getElementById('recStatus').textContent = 'Gagal akses mic: ' + e.message; }
  } else {
    mr.stop(); recording = false; clearInterval(timer);
    document.getElementById('recBtn').textContent = 'REKAM'; document.getElementById('recBtn').classList.remove('on');
    document.getElementById('eq').classList.remove('on');
  }
}
async function submitSetoran() {
  if (!blob) return;
  const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'Mengirim…';
  const fd = new FormData();
  fd.append('audio', blob, 'setoran.webm'); fd.append('user_id', uid);
  fd.append('track_id', recTrack.value); fd.append('unit_ref', recUnit.value);
  try {
    const d = await (await fetch('/api/setoran/upload', { method: 'POST', body: fd })).json();
    if (!d.success) throw new Error(d.error);
    blob = null; recTime.textContent = '00:00';
    load();
  } catch (e) { btn.disabled = false; btn.textContent = 'Kirim Setoran'; document.getElementById('recStatus').textContent = 'Gagal: ' + e.message; }
}

// ───── LIVE NGAI 1-on-1 (murid) ─────
let liveSid = null, liveTimer = null, liveAfter = '1970-01-01', liveBlob = null, liveMr = null, liveChunks = [], liveRec = false, liveT0, liveTick;
async function loadGurus() {
  const gurus = await (await fetch('/api/enroll/' + uid)).json();
  const sel = document.getElementById('guruSel');
  // murid punya guru dari review/setoran → kita ambil semua guru yang pernah review setoran dia
  const list = await (await fetch('/api/guru/murid?guruId=__all__')).json().catch(() => []); // fallback
  const g = (await (await fetch('/api/guru/list')).json().catch(() => ({ gurus: [] }))).gurus || [];
  if (!g.length) { sel.innerHTML = '<option>belum ada pengajar</option>'; return; }
  sel.innerHTML = g.map(x => '<option value="' + x.id + '">' + PP.esc(x.name) + (x.username ? ' (@' + x.username + ')' : '') + '</option>').join('');
  checkLive();
}
async function checkLive() {
  const s = await (await fetch('/api/live?muridId=' + uid)).json();
  const st = document.getElementById('liveStatus');
  if (!s) {
    st.innerHTML = '<div class="note">Belum ada sesi. Pilih pengajar lalu tekan "Minta Sesi Live".</div>';
    liveBtn.style.display = ''; liveBtn.disabled = false; liveBtn.textContent = 'Minta Sesi Live';
    document.getElementById('liveBox').style.display = 'none'; liveSid = null;
  } else if (s.status === 'pending') {
    st.innerHTML = '<div class="note">⏳ Menunggu ustadz merespons… (sesi akan otomatis buka bila diterima)</div>';
    liveBtn.style.display = 'none';
  } else if (s.status === 'rejected') {
    st.innerHTML = '<div class="hint bad">Ustadz belum bisa sekarang. Coba lagi nanti.</div>';
    liveBtn.style.display = ''; liveBtn.disabled = false; liveBtn.textContent = 'Minta Sesi Live'; liveSid = null;
  } else if (s.status === 'active') {
    st.innerHTML = '<div class="hint ok">✅ Sesi live aktif! Baca, lalu tekan kirim untuk dikoreksi.</div>';
    liveBtn.style.display = 'none'; liveSid = s.id; openLiveBox();
  }
  if (liveSid) pollLive();
}
async function startLive() {
  const gid = guruSel.value; if (!gid) return alert('Pilih pengajar dulu.');
  const d = await (await fetch('/api/live', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'start', muridId: uid, guruId: gid }) })).json();
  if (!d.success) return alert(d.error);
  liveBtn.disabled = true; liveBtn.textContent = 'Meminta…';
  checkLive();
}
function openLiveBox() {
  const box = document.getElementById('liveBox'); box.style.display = '';
  if (box.dataset.open === liveSid) return; box.dataset.open = liveSid;
  box.innerHTML = '<div id="liveMsgs" style="max-height:240px;overflow:auto;margin-bottom:10px"></div>'
    + '<div class="rec"><div class="eq" id="leq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'
    + '<button class="rec-orb" id="lrec" onclick="liveToggle()">REKAM</button></div>'
    + '<button class="btn btn-primary btn-block" id="lsend" style="margin-top:10px" disabled onclick="liveSend()">Kirim Bacaan</button>'
    + '<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="liveEnd()">Akhiri Sesi</button>';
  liveAfter = '1970-01-01'; pollLive();
}
async function pollLive() {
  if (!liveSid) return;
  const d = await (await fetch('/api/live?sessionId=' + liveSid + '&after=' + encodeURIComponent(liveAfter))).json();
  if (d.session && d.session.status !== 'active') { alert('Sesi diakhiri.'); location.reload(); return; }
  const box = document.getElementById('liveMsgs');
  (d.messages || []).forEach(m => {
    const wrap = document.createElement('div'); wrap.className = 'item'; wrap.style.animation = 'none';
    const who = m.sender === 'guru' ? '🎓 Ustadz' : '🧕 Kamu';
    wrap.innerHTML = '<div class="sub">' + who + '</div>' + (m.audio_url ? '<audio controls preload="none" src="' + m.audio_url + '"></audio>' : '') + (m.text ? '<div>' + PP.esc(m.text) + '</div>' : '');
    box.appendChild(wrap); box.scrollTop = box.scrollHeight;
    liveAfter = m.created_at;
  });
  liveTimer = setTimeout(pollLive, 2500);
}
async function liveToggle() {
  if (!liveRec) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      liveMr = new MediaRecorder(stream, { mimeType: mime }); liveChunks = [];
      liveMr.ondataavailable = e => liveChunks.push(e.data);
      liveMr.onstop = () => { liveBlob = new Blob(liveChunks, { type: mime }); stream.getTracks().forEach(t => t.stop()); lsend.disabled = false; };
      liveMr.start(); liveRec = true; liveT0 = Date.now(); liveTick = setInterval(() => { const s = Math.floor((Date.now() - liveT0) / 1000); lrec.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 250);
      lrec.textContent = 'SELESAI'; lrec.classList.add('on'); leq.classList.add('on');
    } catch (e) { alert('Gagal mic: ' + e.message); }
  } else { liveMr.stop(); liveRec = false; clearInterval(liveTick); lrec.textContent = 'REKAM'; lrec.classList.remove('on'); leq.classList.remove('on'); }
}
async function liveSend() {
  if (!liveBlob) return; lsend.disabled = true; lsend.textContent = 'Mengirim…';
  const fd = new FormData(); fd.append('audio', liveBlob, 'live.webm'); fd.append('user_id', uid); fd.append('track_id', 'live'); fd.append('unit_ref', 'live-ngaji');
  const d = await (await fetch('/api/setoran/upload', { method: 'POST', body: fd })).json();
  await fetch('/api/live', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'message', sessionId: liveSid, sender: 'murid', userId: uid, audio_url: d.audio_url }) });
  liveBlob = null; lsend.textContent = 'Kirim Bacaan'; pollLive();
}
async function liveEnd() { await fetch('/api/live', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'end', sessionId: liveSid }) }); location.reload(); }

// patch load() agar memuat daftar guru + poll live
const _load = load;
load = async function () { await _load(); loadGurus(); };
load();

</script>
</body>
</html>
