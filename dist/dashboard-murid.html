<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Santri — ponpes.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="murid" data-tab="home">
<div id="hdr"></div>
<div class="wrap">
  <div class="hero">
    <div class="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <h1 id="heroName">Dashboard Santri</h1>
    <p>Rencanakan setoranmu. Rekam bacaan, kirim, lalu tunggu review dari pengajar.</p>
    <div id="heroWave"></div>
  </div>
  <div id="app"><p class="muted" style="text-align:center;padding:30px">Memuat…</p></div>
</div>
<nav id="nav"></nav>
<script src="/assets/app.js"></script>
<script>
const app = document.getElementById('app');
const uid = new URLSearchParams(location.search).get('uid') || localStorage.getItem('uid');
if (uid) localStorage.setItem('uid', uid);
if (!uid) location.href = '/login';
document.getElementById('heroWave').outerHTML = PP.wave(30);

let TRACKS = [['iqro','Iqro','📗'],['fatihah','Al-Fatihah','🕌'],['juz_amma','Juz Amma','🌙'],['tilawah','Tilawah','🎧'],['hafalan','Hafalan','📿']];

async function load() {
  try {
    const d = await (await fetch('/api/enroll/' + uid)).json();
    if (d.error) { app.innerHTML = '<div class="empty"><span class="big">🙏</span>' + PP.esc(d.error) + '</div>'; return; }
    document.getElementById('heroName').textContent = 'Assalamu’alaikum, ' + d.user.name.split(' ')[0];

    const enr = d.enrollments || [];
    const active = enr.filter(e => e.status === 'active');
    const done = enr.filter(e => e.status === 'done').length;
    const set = d.setoran || [];
    const rev = set.filter(s => s.status === 'reviewed').length;

    let h = '';
    h += '<div class="stats">'
       + '<div class="stat"><b>' + active.length + '</b><span>Track aktif</span></div>'
       + '<div class="stat"><b>' + set.length + '</b><span>Total setoran</span></div>'
       + '<div class="stat"><b>' + rev + '</b><span>Reviu diterima</span></div></div>';

    // ---- REKAM ----
    const opts = (active.length ? active.map(e => [e.track_id || TRACKS.find(t => t[1] === e.track)[0], e.track, e.current_unit]) : TRACKS)
      .map(t => '<option value="' + PP.esc(t[0]) + '">' + PP.esc(t[1]) + (t[2] ? ' · ' + PP.esc(t[2]) : '') + '</option>').join('');
    h += '<div class="card" id="rekam">'
      + '<div class="card-t">🎙 Rekam Setoran</div><div class="card-s">Pilih pelajaran, tekan tombol, baca dengan tartil.</div>'
      + '<div class="field"><label>Pelajaran</label><select id="recTrack" class="input">' + opts + '</select></div>'
      + '<div class="field"><label>Unit / halaman</label><input id="recUnit" class="input" placeholder="cth: Iqro 3 halaman 10"></div>'
      + '<div class="rec"><div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'
      + '<button class="rec-orb" id="recBtn" onclick="toggleRec()">REKAM</button>'
      + '<div class="rec-time" id="recTime">00:00</div></div>'
      + '<p class="hint" id="recStatus" style="text-align:center">Tekan tombol untuk mulai merekam.</p>'
      + '<div id="preview"></div>'
      + '<button class="btn btn-primary btn-block" id="submitBtn" style="margin-top:14px" disabled onclick="submitSetoran()">Kirim Setoran</button>'
      + '</div>';

    // ---- SETORAN ----
    h += '<div class="card"><div class="card-t">📚 Setoranku</div>';
    if (!set.length) h += '<div class="empty"><span class="big">🎙</span>Belum ada setoran. Mulai rekam bacaanmu!</div>';
    set.slice(0, 8).forEach((s, i) => {
      const b = s.status === 'reviewed' ? '<span class="badge b-ok">Direview</span>' : '<span class="badge b-pend">Menunggu</span>';
      const au = s.audio_url ? '<audio controls preload="none" src="' + s.audio_url + '"></audio>' : '';
      h += '<div class="item" style="animation-delay:' + (i * 45) + 'ms"><div class="item-h"><b>' + PP.esc(s.track_id || '-') + '</b>' + b + '</div>'
        + '<div class="sub">' + PP.esc(s.unit_ref || '') + (s.created_at ? ' · ' + PP.fmt(s.created_at) : '') + '</div>' + au + '</div>';
    });
    h += '</div>';

    // ---- TRACK ----
    h += '<div class="card"><div class="card-t">🗂 Perjalanan Belajar</div>';
    if (!enr.length) h += '<div class="empty"><span class="big">🌱</span>Belum mulai track apa pun.</div>';
    enr.forEach(e => {
      const pct = e.status === 'done' ? 100 : 30;
      h += '<div class="track"><div class="ico">' + (TRACKS.find(t => t[1] === e.track)?.[2] || '📖') + '</div>'
        + '<div style="flex:1"><div class="nm">' + PP.esc(e.track) + '</div><div class="sub">' + (e.current_unit ? 'Unit: ' + PP.esc(e.current_unit) : 'Aktif') + '</div>'
        + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>'
        + '<span class="badge ' + (e.status === 'done' ? 'b-ok' : 'b-pend') + '">' + (e.status === 'done' ? 'Selesai' : 'Aktif') + '</span></div>';
    });
    h += '</div><div class="foot">ponpes.org — platform tahsin & ngaji online gratis</div>';
    app.innerHTML = h;
  } catch (e) { app.innerHTML = '<div class="empty">Gagal memuat: ' + PP.esc(e.message) + '</div>'; }
}

let mr, chunks = [], recording = false, blob = null, t0, timer;
function tick() { const s = Math.floor((Date.now() - t0) / 1000); document.getElementById('recTime').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
async function toggleRec() {
  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
      mr = new MediaRecorder(stream, { mimeType: mime }); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        blob = new Blob(chunks, { type: mime });
        document.getElementById('preview').innerHTML = '<div class="item" style="margin-top:12px"><div class="sub">Pratinjau hasil rekaman</div><audio controls src="' + URL.createObjectURL(blob) + '"></audio></div>';
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('recStatus').textContent = 'Rekaman siap (' + Math.round(blob.size / 1024) + ' KB) — kirim atau rekam ulang.';
        stream.getTracks().forEach(t => t.stop());
      };
      mr.start(); recording = true; t0 = Date.now(); timer = setInterval(tick, 250);
      document.getElementById('recBtn').textContent = 'SELESAI'; document.getElementById('recBtn').classList.add('on');
      document.getElementById('eq').classList.add('on'); document.getElementById('recStatus').textContent = 'Merekam… baca dengan tartil.';
    } catch (e) { document.getElementById('recStatus').textContent = 'Gagal akses mic: ' + e.message; }
  } else {
    mr.stop(); recording = false; clearInterval(timer);
    document.getElementById('recBtn').textContent = 'REKAM'; document.getElementById('recBtn').classList.remove('on');
    document.getElementById('eq').classList.remove('on');
  }
}
async function submitSetoran() {
  if (!blob) return;
  const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.textContent = 'Mengirim…';
  const fd = new FormData();
  fd.append('audio', blob, 'setoran.webm'); fd.append('user_id', uid);
  fd.append('track_id', recTrack.value); fd.append('unit_ref', recUnit.value);
  try {
    const d = await (await fetch('/api/setoran/upload', { method: 'POST', body: fd })).json();
    if (!d.success) throw new Error(d.error);
    blob = null; recTime.textContent = '00:00';
    load();
  } catch (e) { btn.disabled = false; btn.textContent = 'Kirim Setoran'; document.getElementById('recStatus').textContent = 'Gagal: ' + e.message; }
}
load();
</script>
</body>
</html>
