<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Santri — ponpes.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="auth">
<div id="hdr"></div>
<div class="wrap" style="max-width:500px;padding-top:8px">
  <div class="hero">
    <div class="ar">خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ</div>
    <h1>Mulai Belajar Ngaji</h1>
    <p>Gratis selamanya. Setor bacaan, dapat reviu langsung dari pengajar.</p>
    <div id="heroWave"></div>
  </div>
  <div class="card">
    <div class="field"><label>Nama lengkap</label><input id="name" class="input" placeholder="mis: Budi Santoso"></div>
    <div class="field"><label>Username publik</label><div class="uwrap"><span class="pre">@</span><input id="username" class="input" maxlength="20" placeholder="budi_ngaji"></div><p class="hint" id="uhint">3–20 huruf kecil, angka, underscore — jadi alamat ponpes.org/@username</p></div>
    <div class="field"><label>Email</label><input id="email" type="email" class="input" placeholder="nama@email.com" autocomplete="email"></div>
    <div class="field"><label>Nomor WhatsApp</label><input id="wa" class="input" placeholder="628123... (untuk notifikasi reviu)"></div>
    <div class="field"><label>Password</label><input id="pass" type="password" class="input" placeholder="minimal 6 karakter"></div>
    <div class="field"><label>Kamu mendaftar sebagai</label>
      <div class="seg" style="margin:6px 0 0">
        <button id="r_murid" aria-selected="true" onclick="setRole('murid')">🧕 Santri</button>
        <button id="r_guru" aria-selected="false" onclick="setRole('guru')">🎓 Pengajar</button>
      </div>
    </div>
    <div class="field" id="onbGoal"><label>Tujuan belajar</label>
      <div class="seg" style="margin:6px 0 0">
        <button id="g_read" aria-selected="true" onclick="setGoal('read')">📖 Bisa baca</button>
        <button id="g_tartil" aria-selected="false" onclick="setGoal('tartil')">🎯 Tartil</button>
        <button id="g_hafalan" aria-selected="false" onclick="setGoal('hafalan')">📿 Hafal</button>
        <button id="g_koreksi" aria-selected="false" onclick="setGoal('koreksi')">✨ Koreksi</button>
      </div>
    </div>
    <div class="field" id="onbLevel"><label>Level sekarang</label>
      <select id="level" class="input">
        <option value="beginner">Belum bisa / baru mulai</option>
        <option value="basic">Bisa tapi belum tartil</option>
        <option value="fluent">Lancar, mau naik level</option>
      </select>
    </div>
    <div class="field"><label>Kode referral (opsional)</label><input id="ref" class="input" placeholder="kode dari teman / ustadz"></div>
    <p class="hint bad" id="err" style="min-height:20px"></p>
    <button class="btn btn-primary btn-block" id="btn">Daftar Sekarang</button>
    <p class="hint" style="text-align:center;margin-top:14px">Sudah punya akun? <a href="/login">Masuk</a></p>
  </div>
  <div class="foot">ponpes.org — platform tahsin & ngaji online gratis</div>
</div>
<script src="/assets/app.js"></script>
<script>
document.getElementById('heroWave').outerHTML = PP.wave(24);
let role = 'murid', uState = 'empty', goal = 'read';
const REF = new URLSearchParams(location.search).get('ref') || new URLSearchParams(location.search).get('u') || '';
if (REF) ref.value = REF;
function setRole(r) {
  role = r; r_murid.setAttribute('aria-selected', r === 'murid'); r_guru.setAttribute('aria-selected', r === 'guru');
  btn.textContent = r === 'guru' ? 'Lanjut ke Form Pengajar' : 'Daftar Sekarang';
  document.getElementById('onbGoal').style.display = r === 'murid' ? '' : 'none';
  document.getElementById('onbLevel').style.display = r === 'murid' ? '' : 'none';
}
function setGoal(g) {
  goal = g;
  ['read','tartil','hafalan','koreksi'].forEach(x => document.getElementById('g_' + x).setAttribute('aria-selected', x === g));
}
let tt;
document.addEventListener('input', function (e) {
  if (e.target.id !== 'username') return;
  const v = e.target.value.trim().toLowerCase();
  if (!v) { uState = 'empty'; uhint.textContent = '3–20 huruf kecil, angka, underscore — jadi alamat ponpes.org/@username'; uhint.className = 'hint'; return; }
  if (!/^[a-z0-9_]{3,20}$/.test(v)) { uState = 'bad'; uhint.textContent = 'Format salah: 3–20 huruf kecil, angka, underscore'; uhint.className = 'hint bad'; return; }
  uState = 'checking'; uhint.textContent = 'mengecek…'; uhint.className = 'hint';
  clearTimeout(tt); tt = setTimeout(async () => {
    const d = await (await fetch('/api/auth/check-username?u=' + encodeURIComponent(v))).json();
    if (v !== username.value.trim().toLowerCase()) return;
    uState = d.available ? 'ok' : 'bad';
    uhint.textContent = d.available ? '✓ @' + v + ' tersedia' : '✗ @' + v + ' sudah diambil';
    uhint.className = 'hint ' + (d.available ? 'ok' : 'bad');
  }, 450);
});
async function daftar() {
  if (role === 'guru') { location.href = '/daftar-guru'; return; }
  err.textContent = '';
  if (!name.value.trim() || !email.value.trim() || pass.value.length < 6) { err.textContent = 'Lengkapi nama, email, dan password (min 6 karakter).'; return; }
  if (uState !== 'ok') { err.textContent = 'Username belum tersedia / masih dicek.'; return; }
  btn.disabled = true; btn.textContent = 'Membuat akun…';
  try {
    const d = await (await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name.value.trim(), username: username.value.trim().toLowerCase(), email: email.value.trim(), wa_number: wa.value.trim(), password: pass.value, role: 'murid', ref: ref.value.trim(), goal: goal, level: level.value }) })).json();
    if (!d.success) throw new Error(d.error || 'Gagal daftar');
    localStorage.setItem('user', JSON.stringify(d.user));
    localStorage.setItem('uid', d.user.id);
    location.href = '/dashboard-murid?uid=' + d.user.id;
  } catch (x) { err.textContent = x.message; btn.disabled = false; btn.textContent = 'Daftar Sekarang'; }
}
btn.onclick = daftar;
</script>
</body>
</html>
