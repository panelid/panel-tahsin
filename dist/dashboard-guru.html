<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponpes Digital — Dashboard Guru</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-50 min-h-screen">
  <div class="max-w-2xl mx-auto p-6">
    <h1 class="text-2xl font-bold text-teal-700 mb-4">📖 Dashboard Guru</h1>
    <div id="app" class="space-y-4"></div>
  </div>
  <script>
    async function load() {
      const r = await fetch('/api/guru/pending'); const list = await r.json();
      let html = '<h2 class="font-semibold">Setoran Menunggu Review ('+list.length+')</h2>';
      if (!list.length) html += '<p class="text-gray-500">Kosong.</p>';
      list.forEach(s => {
        html += '<div class="bg-white p-3 rounded shadow" id="'+s.id+'">'+
          '<p><b>'+s.murid+'</b> — '+s.track_id+' '+(s.unit_ref||'')+' <small>'+s.created_at+'</small></p>'+
          '<input id="unit_'+s.id+'" value="'+s.unit_ref+'" class="border p-1 rounded w-32">'+
          '<input id="score_'+s.id+'" type="number" min="1" max="10" placeholder="skor" class="border p-1 rounded w-16">'+
          '<input id="cat_'+s.id+'" placeholder="catatan" class="border p-1 rounded">'+
          '<button onclick="review(\''+s.id+'\')" class="bg-teal-600 text-white p-1 rounded ml-2">Review</button></div>';
      });
      document.getElementById('app').innerHTML = html;
    }
    async function review(id) {
      await fetch('/api/review/submit', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({setoranId:id,unitRef:document.getElementById('unit_'+id).value,score:document.getElementById('score_'+id).value,catatan:document.getElementById('cat_'+id).value})});
      load();
    }
    load();
  </script>
</body>
</html>
