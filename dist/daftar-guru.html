<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Jadi Pengajar — ponpes.org</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600&display=swap" rel="stylesheet">
  <style>
    :root{--base:#F6F5EF;--teal:#1E4640;--amber:#E3A23B;--ink:#1C2420;--soft:#E7EEE6;--muted:#5A655F;--line:#D9DED8;--ok:#1f8a55;--bad:#c0392b}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--base);color:var(--ink);font-size:16px;line-height:1.7;padding:24px 16px}
    .wrap{max-width:480px;margin:0 auto}
    h1{font-family:'Literata',serif;font-size:26px;margin-bottom:6px}
    p.lead{color:var(--muted);margin-bottom:20px}
    .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
    .fld{margin:10px 0}
    .ipt{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-family:'Plus Jakarta Sans';font-size:14px;background:#fff;color:var(--ink)}
    .ipt:focus{outline:2px solid var(--amber)}
    .un{display:flex;align-items:center;gap:8px}
    .un .pre{font-weight:700;color:var(--teal)}
    .hint{font-size:13px;margin-top:4px;min-height:18px}
    .chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;padding:12px;background:var(--soft);border-radius:12px;cursor:pointer}
    .chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--teal)}
    .chk small{display:block;color:var(--muted)}
    .btn{display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;border-radius:12px;padding:12px 20px;text-decoration:none;cursor:pointer;border:1px solid transparent;font-family:'Plus Jakarta Sans';width:100%}
    .btn-amber{background:var(--amber);color:#221A06}
    .btn-amber:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(227,162,59,.35)}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    a{color:var(--teal);font-weight:600;text-decoration:none}
    .back{display:inline-block;margin-bottom:12px;font-size:14px}
    #msg{font-size:14px;margin-top:10px;min-height:20px}
    .ok{color:var(--ok)} .bad{color:var(--bad)}
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back">← ponpes.org</a>
    <h1>Daftar Jadi Pengajar</h1>
    <p class="lead">Isi data & kirim contoh bacaan. Tim akan verifikasi lalu aktifkan sebagai pengajar.</p>
    <div class="box">
      <input id="name" class="ipt" placeholder="nama lengkap">
      <div class="fld">
        <div class="un"><span class="pre">@</span><input id="username" class="ipt" placeholder="username (mis: ustz_aisyah)" maxlength="20"></div>
        <div class="hint muted" id="uhint">3-20 karakter: huruf kecil, angka, underscore. Ini alamat profilmu: ponpes.org/@username</div>
      </div>
      <input id="email" class="ipt" type="email" placeholder="email">
      <input id="wa" class="ipt" placeholder="whatsapp (62...)">
      <input id="pass" class="ipt" type="password" placeholder="password">
      <input id="demo" class="ipt" placeholder="URL demo audio bacaan (opsional)">
      <input id="cert" class="ipt" placeholder="URL sertifikat (opsional)">

      <label class="chk">
        <input type="checkbox" id="become_student">
        <span><b>Saya juga ingin belajar sebagai murid</b>
        <small>Akunmu tetap pengajar, tapi kamu bisa merekam setoran & belajar ke pengajar yang lebih ahli.</small></span>
      </label>

      <button class="btn btn-amber" id="btn">Kirim Permintaan</button>
      <p id="msg"></p>
    </div>
    <p style="text-align:center;margin-top:16px"><a href="/login.html">Sudah jadi pengajar? Masuk</a></p>
  </div>
  <script>
    const unameEl = document.getElementById('username');
    const uhint = document.getElementById('uhint');
    const btn = document.getElementById('btn');
    let uState = 'empty';

    function setU(text, cls) { uhint.textContent = text; uhint.className = 'hint ' + cls; }
    let t;
    unameEl.addEventListener('input', () => {
      const u = unameEl.value.trim().toLowerCase();
      uState = 'checking'; btn.disabled = true;
      if (!u) { uState = 'empty'; setU('3-20 karakter: huruf kecil, angka, underscore.', 'muted'); btn.disabled = false; return; }
      if (!/^[a-z0-9_]{3,20}$/.test(u)) { uState = 'bad'; setU('Format salah: 3-20 huruf kecil, angka, underscore.', 'bad'); btn.disabled = false; return; }
      clearTimeout(t); t = setTimeout(check, 400);
    });
    async function check() {
      const u = unameEl.value.trim().toLowerCase();
      const r = await fetch('/api/auth/check-username?u=' + encodeURIComponent(u));
      const d = await r.json();
      if (d.available) { uState = 'ok'; setU('✓ tersedia', 'ok'); }
      else { uState = 'bad'; setU('✗ sudah diambil', 'bad'); }
      btn.disabled = false;
    }

    async function daftar() {
      const u = unameEl.value.trim().toLowerCase();
      if (uState !== 'ok') { msg.textContent = 'Username belum tersedia/valid.'; msg.style.color = '#c0392b'; return; }
      btn.disabled = true; msg.textContent = 'Mengirim…'; msg.style.color = 'var(--muted)';
      const body = { name:name.value, username:u, email:email.value, wa_number:wa.value, password:pass.value, role:'guru', become_student: document.getElementById('become_student').checked };
      const r = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const d = await r.json();
      if (d.success) {
        await fetch('/api/guru/verify', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ userId:d.user.id, demoAudioUrl:demo.value, certUrl:cert.value }) });
        msg.textContent = 'Permintaan terkirim! Tim akan verifikasi.';
        msg.style.color = 'var(--teal)';
        setTimeout(()=>location.href='/login.html', 1800);
      } else { msg.textContent = d.error; msg.style.color = '#c0392b'; btn.disabled = false; }
    }
    document.getElementById('btn').onclick = daftar;
  </script>
</body>
</html>
