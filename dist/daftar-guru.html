<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Pengajar — ponpes.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/rec.js" defer></script>
</head>
<body data-page="auth">
<div id="hdr"></div>
<div class="wrap">
  <div class="hero">
    <div class="ar">هَلْ مِن مُّبَلِّغٍ عَنِّي</div>
    <h1>Mulai Mengajar</h1>
    <p>Bagikan ilmumu. Cukup 3 langkah: identitas, bukti sanad, lalu setor bacaan Al-Hajj 1–5 untuk direviu para pengajar.</p>
    <div id="heroWave"></div>
  </div>

  <div class="card" id="wizard"></div>
  <p class="hint" style="text-align:center;margin-top:14px">Sudah jadi pengajar? <a href="/login">Masuk di sini</a></p>
  <div class="foot">ponpes.org — platform tahsin & ngaji online gratis</div>
</div>
<script src="/assets/app.js"></script>
<script>
document.getElementById('heroWave').outerHTML = PP.wave(30);
const box = document.getElementById('wizard');
let step = 1, userId = null, uState = 'empty', blob = null, mr = null, chunks = [], rec = false, t0, timer;
const form = { name: '', username: '', email: '', wa: '', pass: '', bukti: 'sanad', sanadUrl: '', mahadText: '', certUrl: '' };

function dots() { return '<div style="display:flex;gap:6px;align-items:center;margin-bottom:18px">'
  + [1, 2, 3].map(n => '<span style="width:' + (n === step ? 26 : 9) + 'px;height:9px;border-radius:9px;background:' + (n <= step ? 'var(--amber)' : 'var(--line2)') + ';transition:.3s"></span>').join('')
  + '<span class="sub" style="margin-left:6px">Langkah ' + step + ' dari 3</span></div>'; }

function draw() {
  box.innerHTML = dots() + [step1, step2, step3][step - 1]();
  if (step === 1) { name.value = form.name; uname.value = form.username; email.value = form.email; wa.value = form.wa; pass.value = form.pass; }
}
function step1() {
  return '<div class="card-t">Langkah 1 · Identitas</div><div class="card-s">Isi datamu — username jadi alamat profilmu: ponpes.org/@username</div>'
    + f('Nama lengkap', '<input id="name" class="input" placeholder="mis: Aisyah binti Yusuf">')
    + f('Username', '<div class="uwrap"><span class="pre">@</span><input id="uname" class="input" maxlength="20" placeholder="ustz_aisyah"></div><p class="hint" id="uhint">3–20 huruf kecil, angka, atau underscore</p>')
    + f('Email', '<input id="email" type="email" class="input" placeholder="nama@email.com">')
    + f('Nomor WhatsApp', '<input id="wa" class="input" placeholder="628123...">')
    + f('Password', '<input id="pass" type="password" class="input" placeholder="minimal 6 karakter">')
    + '<button class="btn btn-primary btn-block" style="margin-top:8px" onclick="next1()">Lanjut →</button>';
}
function step2() {
  return '<div class="card-t">Langkah 2 · Bukti Keilmuan <span style="font-size:12px;color:var(--muted)">(opsional)</span></div><div class="card-s">Biar reviu lebih cepat, tambahkan sanad / riwayat Ma’had. Tapi <b>gak wajib</b> — yang utama kamu rekam bacaan Al-Hajj 1–5.</div>'
    + '<div class="seg" style="margin-bottom:14px">'
    + ['sanad|Sertifikat Sanad', 'mahad|Riwayat Ma\'had', 'cert|Sertifikat Lain'].map(function (o) { const v = o.split('|')[0];
      return '<button onclick="pickBukti(\'' + v + '\')" aria-selected="' + (form.bukti === v) + '">' + o.split('|')[1] + '</button>'; }).join('') + '</div>'
    + (form.bukti === 'sanad' ? f('URL sertifikat sanad', '<input id="sanadUrl" class="input" placeholder="https://... (Google Drive / link gambar)">') : '')
    + (form.bukti === 'mahad' ? f('Riwayat belajar', '<textarea id="mahadText" class="input" placeholder="Contoh: Santri Ma\'had Al-Furqan 2015–2020, sanad tahsin dari Ustadz Yusuf, 6 tahun"></textarea>') : '')
    + (form.bukti === 'cert' ? f('URL sertifikat', '<input id="certUrl" class="input" placeholder="https://...">') : '')
    + '<div style="display:flex;gap:9px"><button class="btn btn-ghost" onclick="step=1;draw()">← Kembali</button><button class="btn btn-primary" style="flex:1" onclick="next2()">Lanjut →</button></div>';
}
function step3() {
  const au = blob ? '<div class="item" style="margin-top:12px"><div class="sub">Pratinjau rekaman</div><audio controls src="' + URL.createObjectURL(blob) + '"></audio></div>' : '';
  return '<div class="card-t">Langkah 3 · Setor Bacaan</div><div class="card-s">Rekam bacaan <b>Al-Hajj ayat 1–5</b>. Para pengajar akan menyimak sebelum menyetujui.</div>'
    + '<div class="quote">وَأَقِيمُوا وُجُوهَكُمۡ عِندَ كُلِّ مَسْجِدٍ‬</div>'
    + '<div class="rec"><div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'
    + '<button class="rec-orb" id="recBtn" onclick="toggleRec()">REKAM</button><div class="rec-time" id="recTime">00:00</div></div>'
    + '<p class="hint" id="recStatus" style="text-align:center">Tekan tombol lalu baca Al-Hajj 1–5</p>' + au
    + '<div class="note" style="margin-top:14px;margin-bottom:0">📩 Setelah kirim, semua pengajar terdaftar bisa mereviu. Cukup <b>1 ACC</b> — kamu langsung jadi pengajar.</div>'
    + '<div style="display:flex;gap:9px;margin-top:14px"><button class="btn btn-ghost" onclick="step=2;draw()">← Kembali</button><button class="btn btn-gold" style="flex:1" id="subBtn" onclick="kirim()">Kirim Permintaan</button></div>';
}
function f(l, i) { return '<div class="field"><label>' + l + '</label>' + i + '</div>'; }
function pickBukti(v) { form.sanadUrl = (sanadUrl && sanadUrl.value) || form.sanadUrl; form.mahadText = (mahadText && mahadText.value) || form.mahadText; form.certUrl = (certUrl && certUrl.value) || form.certUrl; form.bukti = v; draw(); }

let tt;
function checkU(v) {
  uState = 'checking'; const h = document.getElementById('uhint'); h.textContent = 'mengecek…'; h.className = 'hint';
  clearTimeout(tt); tt = setTimeout(async () => {
    const d = await (await fetch('/api/auth/check-username?u=' + encodeURIComponent(v))).json();
    if (v !== uname.value.trim().toLowerCase()) return;
    uState = d.available ? 'ok' : 'bad';
    h.textContent = d.available ? '✓ @' + v + ' tersedia' : '✗ @' + v + ' sudah diambil';
    h.className = 'hint ' + (d.available ? 'ok' : 'bad');
  }, 450);
}
document.addEventListener('input', function (e) {
  if (e.target.id === 'uname') { const v = e.target.value.trim().toLowerCase();
    if (!v) { uState = 'empty'; document.getElementById('uhint').textContent = '3–20 huruf kecil, angka, atau underscore'; document.getElementById('uhint').className = 'hint'; return; }
    if (!/^[a-z0-9_]{3,20}$/.test(v)) { uState = 'bad'; document.getElementById('uhint').textContent = 'Format salah: 3–20 huruf kecil, angka, underscore'; document.getElementById('uhint').className = 'hint bad'; return; }
    checkU(v); }
});
function next1() {
  form.name = name.value.trim(); form.username = uname.value.trim().toLowerCase(); form.email = email.value.trim(); form.wa = wa.value.trim(); form.pass = pass.value;
  if (!form.name || !form.email || form.pass.length < 6) return alert('Lengkapi nama, email, dan password (min 6 karakter).');
  if (uState !== 'ok') return alert('Username belum tersedia / masih dicek.');
  step = 2; draw();
}
function next2() {
  if (form.bukti === 'sanad') form.sanadUrl = (sanadUrl || {}).value || '';
  if (form.bukti === 'mahad') form.mahadText = (mahadText || {}).value || '';
  if (form.bukti === 'cert') form.certUrl = (certUrl || {}).value || '';
  step = 3; draw();
}
function tick() { const s = Math.floor((Date.now() - t0) / 1000); recTime.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function setEq(el, lvl) { if (!el) return; const bars = el.children; for (let i = 0; i < bars.length; i++) { const h = 9 + (lvl * 28 * (0.5 + Math.abs(Math.sin(i * 1.3)))); bars[i].style.height = Math.min(30, h) + 'px'; } }
async function toggleRec() {
  if (!rec) {
    try {
      const r = await HiRec.start({ onTick: t => recTime.textContent = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(Math.floor(t % 60)).padStart(2, '0'), onLevel: l => setEq(eq, l) });
      rec = true; t0 = Date.now(); recBtn.textContent = 'SELESAI'; recBtn.classList.add('on'); eq.classList.add('on'); recStatus.textContent = 'Merekam… baca Al-Hajj 1–5 dengan tartil.';
    } catch (e) { recStatus.textContent = 'Gagal akses mic: ' + e.message; }
  } else {
    recBtn.textContent = 'Memproses…'; recBtn.disabled = true;
    const r = await HiRec.stop(); blob = r.blob; rec = false; setEq(eq, 0);
    recBtn.textContent = 'REKAM'; recBtn.classList.remove('on'); eq.classList.remove('on'); recBtn.disabled = false;
    draw();
  }
}
async function kirim() {
  if (!blob) return alert('Rekam bacaan Al-Hajj 1–5 dulu.');
  const btn = document.getElementById('subBtn'); btn.disabled = true; btn.textContent = 'Mendaftar…';
  const reg = await (await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: form.name, username: form.username, email: form.email, wa_number: form.wa, password: form.pass, role: 'guru' }) })).json();
  if (!reg.success) { btn.disabled = false; btn.textContent = 'Kirim Permintaan'; return alert(reg.error); }
  userId = reg.user.id;
  btn.textContent = 'Mengirim bacaan…';
  const fd = new FormData();
  fd.append('userId', userId);
  fd.append('sanadUrl', form.bukti === 'sanad' ? form.sanadUrl : '');
  fd.append('mahadText', form.bukti === 'mahad' ? form.mahadText : '');
  fd.append('certUrl', form.bukti === 'cert' ? form.certUrl : '');
  fd.append('audio', blob, 'al-hajj-1-5.webm');
  const v = await (await fetch('/api/guru/verify', { method: 'POST', body: fd })).json();
  if (!v.success) { btn.disabled = false; btn.textContent = 'Kirim Permintaan'; return alert(v.error || 'Gagal'); }
  box.innerHTML = '<div class="empty"><span class="big">🎉</span><h3 style="margin-bottom:6px">Terima kasih, ' + PP.esc(form.name.split(' ')[0]) + '!</h3>'
    + '<p>Permintaanmu terkirim. Para pengajar akan menyimak bacaan Al-Hajj 1–5-mu.<br>Cukup <b>1 guru ACC</b> — kamu resmi jadi pengajar.</p>'
    + '<button class="btn btn-primary btn-block" style="margin-top:18px;max-width:280px" onclick="location.href=\'/login\'">Ke Halaman Masuk</button></div>';
}
draw();
</script>
</body>
</html>
