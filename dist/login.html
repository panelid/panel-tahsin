<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — ponpes.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body data-page="auth">
<div id="hdr"></div>
<div class="wrap" style="max-width:460px;padding-top:8px">
  <div class="hero">
    <div class="ar">ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ</div>
    <h1>Welcome back</h1>
    <p>Lanjutkan perjalanan mengajimu.</p>
    <div id="heroWave"></div>
  </div>
  <div class="card">
    <div class="field"><label>Email</label><input id="email" type="email" class="input" placeholder="nama@email.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="password" type="password" class="input" placeholder="••••••••" autocomplete="current-password"></div>
    <p class="hint bad" id="err" style="min-height:20px"></p>
    <button class="btn btn-primary btn-block" id="btn">Masuk</button>
    <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:14px">
      <a href="/daftar">Belum punya akun? Daftar</a>
      <a href="/daftar-guru">Jadi pengajar →</a>
    </div>
  </div>
  <div class="foot">ponpes.org — platform tahsin & ngaji online gratis</div>
</div>
<script src="/assets/app.js"></script>
<script>
document.getElementById('heroWave').outerHTML = PP.wave(24);
async function masuk() {
  const e = email.value.trim(), p = password.value;
  if (!e || !p) { err.textContent = 'Isi email dan password.'; return; }
  btn.disabled = true; btn.textContent = 'Memeriksa…'; err.textContent = '';
  try {
    const d = await (await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: e, password: p }) })).json();
    if (!d.success) throw new Error(d.error || 'Gagal masuk');
    localStorage.setItem('user', JSON.stringify(d.user));
    localStorage.setItem('uid', d.user.id);
    location.href = (d.user.role === 'murid' || d.user.role === 'guru_pending') ? '/dashboard-murid?uid=' + d.user.id : '/dashboard-guru';
  } catch (x) { err.textContent = x.message; btn.disabled = false; btn.textContent = 'Masuk'; }
}
btn.onclick = masuk;
password.addEventListener('keydown', e => e.key === 'Enter' && masuk());
</script>
</body>
</html>
